<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    .chat-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      padding: 1rem;
      gap: 0.5rem;
      pointer-events: none;
    }

    .chat-bubble {
      position: relative;
      max-width: 80%;
      background: #e8f2ff; /* 연한 남색 느낌 */
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      pointer-events: auto;
      animation: fadeInUp 0.3s ease-out;
      word-break: break-word;
    }

    .chat-bubble .name {
      font-weight: bold;
      color: #003366; /* 남색 */
      margin-bottom: 0.25rem;
      display: block;
    }

    .chat-bubble .character {
      position: absolute;
      top: -25px;
      right: -25px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: transparent;
    }

    .chat-bubble .character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- 예시 채팅 -->
    <div class="chat-bubble">
      <span class="name">치지직 청청아</span>
      생방송 시작했어요! 다들 어서 와~
      <div class="character">
        <img src="25cec092-77f2-4bb4-bd18-14388e2cd01c.png" alt="캐릭터" />
      </div>
    </div>
  </div>
</body>
</html>
