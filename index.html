<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>채팅 자막 스타일</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 1rem;
      pointer-events: none;
      height: 100vh;
    }

    .chat-bubble {
      font-size: 1.6rem;
      font-weight: 900;
      color: white;
      text-shadow:
        -2px -2px 0 black,
         2px -2px 0 black,
        -2px  2px 0 black,
         2px  2px 0 black;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      pointer-events: auto;
      animation: fadeInUp 0.3s ease-out;
      word-break: break-word;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer"></div>

  <script>
    const messages = [
      "ㅋㅋㅋㅋㅋㅋㅋㅋㅋ",
      "안녕하세요~",
      "와 진짜 이쁘다",
      "헉 목소리 뭐야..",
      "존예다..",
      "고양이 같다!",
      "오늘도 잘 보고 갑니다~",
    ];

    const chatContainer = document.getElementById("chatContainer");
    let index = 0;

    function addChat() {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble";
      bubble.textContent = messages[index % messages.length];
      chatContainer.prepend(bubble);
      index++;
      if (chatContainer.children.length > 15) {
        chatContainer.removeChild(chatContainer.lastChild);
      }
    }

    setInterval(addChat, 1500);
  </script>
</body>
</html>
