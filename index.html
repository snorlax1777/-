<!-- 폰트 로드 (CDN) -->
<link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/SpoqaHanSansNeo-Regular.woff" rel="stylesheet" as="font" type="font/woff" crossorigin="anonymous">
<style>
@font-face {
  font-family: 'SpoqaHanSansNeo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/SpoqaHanSansNeo-Regular.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: 'SpoqaHanSansNeo', sans-serif;
  overflow: hidden;
}

.chat-container {
  display: flex;
  flex-direction: column-reverse;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 1rem;
  pointer-events: none;
  height: 100vh;
}

.chat-bubble {
  position: relative;
  max-width: 80%;
  background: #fff;
  color: #000;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  border: 2px solid #d2b48c; /* 연갈색 외곽선 */
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  pointer-events: auto;
  animation: fadeInUp 0.3s ease-out;
  word-break: break-word;
  font-size: 1rem;
}

/* 캐릭터 이미지 */
.chat-bubble .character {
  position: absolute;
  top: -18px;
  right: -18px;
  width: 36px;
  height: 36px;
}

.chat-bubble .character img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  content: url("https://i.imgur.com/IUAhMUa.png");
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
