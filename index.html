<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    .chat-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      padding: 1rem;
      gap: 0.5rem;
      pointer-events: none;
    }

    .chat-bubble {
      position: relative;
      max-width: 80%;
      background: transparent;
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      pointer-events: auto;
      animation: fadeInUp 0.3s ease-out;
      word-break: break-word;
    }

    .chat-bubble .character {
      position: absolute;
      top: -25px;
      right: -25px;
      width: 50px;
      height: 50px;
    }

    .chat-bubble .character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- 아래 예시 채팅은 테스트용입니다. 실제 방송에서는 위플랩이 자동으로 채팅을 추가합니다. -->
    <div class="chat-bubble">
      생방송 시작했어요! 다들 어서 와~
      <div class="character">
        <img src="https://cdn.discordapp.com/attachments/1346415542105411677/1380035217112305815/bf9c86ccf833310f.jpg?ex=684e46f3&is=684cf573&hm=dfcd39723dbc14e1bb9642d15a40a3e4096cad95791b8f4c7ac859ea52a1a9b8&" alt="캐릭터" />
      </div>
    </div>
  </div>
</body>
</html>
