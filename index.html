<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>채팅 테스트</title>
  <style>
    @font-face {
      font-family: 'BMYEONSUNGOTF';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/BMYEONSUNGOTF.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'BMYEONSUNGOTF', sans-serif;
      overflow: hidden; /* ← 스크롤 방지 */
    }

    .chat-container {
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 1rem;
      pointer-events: none;
      height: 100vh;
    }

    .chat-bubble {
      position: relative;
      max-width: 80%;
      background: #fff;
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 2px solid #d2b48c;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      pointer-events: auto;
      animation: fadeInUp 0.3s ease-out;
      word-break: break-word;
      font-size: 1rem;
    }

    .chat-bubble .character {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 36px;
      height: 36px;
    }

    .chat-bubble .character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer"></div>

  <script>
    const messages = [
      "뚜하",
      "오늘 방송도 얼마나 뚜바뚜보이실지 기대되네요ㅎ!",
      "뚜뚜님 그거 아세여? 뚜둥이들 너무 멋진거 같아요 😍",
      "뚜바뚜보~",
      "ㅋㅋㅋㅋㅋㅋㅋㅋ",
      "오늘 점심에 뭐 드셨나여?",
      "맛난거 드시네! 돼지뚜!!",
      "와 진짜 혼자 맛난거 먹기에여?!~",
      "귀엽네요",
      "채팅창이ㅎ 캬캬캬컄"
      "뚜뚜뭉,잠만보,두부,욜무Tea,Tame 아자아자 화이팅!"
    ];

    const chatContainer = document.getElementById("chatContainer");
    let index = 0;

    function addChat() {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble";
      bubble.innerHTML = `
        ${messages[index % messages.length]}
        <div class="character">
          <img src="https://i.imgur.com/IUAhMUa.png" alt="캐릭터" />
        </div>
      `;
      chatContainer.prepend(bubble);
      index++;
      if (chatContainer.children.length > 15) {
        chatContainer.removeChild(chatContainer.lastChild);
      }
    }

    setInterval(addChat, 1500);
  </script>
</body>
</html>
