<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설하임 채팅</title>

  <!-- 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f0faff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 360px;
      height: 540px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #b3e5fc;
      color: #0288d1;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #4fc3f7; }
      50% { text-shadow: 0 0 10px #81d4fa; }
      100% { text-shadow: 0 0 5px #4fc3f7; }
    }

    .chat-messages {
      flex-grow: 1;
      background-color: #e6f7fb;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
      position: relative;
    }

    .cat-box {
      background-color: #daf2f9;
      border: 2px dashed #81d4fa;
      border-radius: 15px;
      padding: 10px 14px;
      max-width: 75%;
      word-break: break-word;
      font-size: 15px;
      color: #333;
      position: relative;
      animation: pop-in 0.3s ease-out;
    }

    .cat-box::before {
      content: '';
      position: absolute;
      top: 10px;
      left: -10px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-right: 10px solid #81d4fa;
      border-bottom: 10px solid transparent;
    }

    .chat-avatar {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 28px;
      height: 28px;
      background-image: url("/mnt/data/d1a2fe25-ad34-4713-926c-c53ab418ae91.png");
      background-size: cover;
      border-radius: 50%;
      border: 1px solid #81d4fa;
    }

    @keyframes pop-in {
      0% { opacity: 0; transform: scale(0.7); }
      80% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">설하임</div>
    <div class="chat-messages" id="messages"></div>
  </div>
