<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>치지직 청청아 채팅</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #eef6ff; /* 연한 남색 느낌 */
    }

    .header {
      background-color: #d3eaff; /* 연한 남색 */
      color: #003366;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    .chat-container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #f7fbff; /* 흰색 + 연한 남색 중간 */
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      position: relative;
    }

    .message {
      background-color: #ffffff;
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      color: #003366;
      position: relative;
      display: inline-block;
      max-width: 80%;
    }

    .username {
      color: #003366; /* 남색 */
      font-weight: bold;
      margin-bottom: 6px;
    }

    .chat-character {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .input-area {
      display: flex;
      margin-top: 20px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 8px 0 0 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .input-area button {
      background-color: #5c9dff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:hover {
      background-color: #478ee6;
    }
  </style>
</head>
<body>
  <div class="header">치지직 청청아의 채팅창</div>

  <div class="chat-container">
    <img src="https://raw.githubusercontent.com/사용자명/레포명/브랜치명/경로/892c1f5a-c5a0-4cbe-a98e-9ecf0bae4095.png" class="chat-character" alt="캐릭터" />
    
    <div class="message">
      <div class="username">청청아</div>
      안녕하세요! 오늘도 치지직~ 🐰
    </div>

    <div class="input-area">
      <input type="text" placeholder="메시지를 입력하세요...">
      <button>입력</button>
    </div>
  </div>
</body>
</html>
