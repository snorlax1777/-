<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뚜뚜뭉 채팅</title>

  <!-- 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f0faff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 360px;
      height: 540px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #ffffff;  /* 흰색으로 변경 */
      color: #6f4f1f;  /* 갈색으로 변경 */
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #4fc3f7; }
      50% { text-shadow: 0 0 10px #81d4fa; }
      100% { text-shadow: 0 0 5px #4fc3f7; }
    }

    .chat-messages {
      flex-grow: 1;
      background-color: #f5f0e1;  /* 흰색과 연갈색의 사이 색으로 변경 */
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
      position: relative;
    }

    .cat-box {
      background-color: #daf2f9;
      border: 2px dashed #81d4fa;
      border-radius: 15px;
      padding: 10px 14px;
      max-width: 75%;
      word-break: break-word;
      font-size: 15px;
      color: #333;
      position: relative;
      animation: pop-in 0.3s ease-out;
    }

    .cat-box::before {
      content: '';
      position: absolute;
      top: 10px;
      left: -10px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-right: 10px solid #81d4fa;
      border-bottom: 10px solid transparent;
    }

    @keyframes pop-in {
      0% { opacity: 0; transform: scale(0.7); }
      80% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .chat-input {
      display: flex;
      padding: 12px;
      background-color: #e1f5fe;
      border-top: 2px solid #b3e5fc;
    }

    .chat-input input {
      flex-grow: 1;
      border: 2px solid #81d4fa;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 14px;
      background-color: #ffffff;
    }

    .chat-input button {
      margin-left: 8px;
      background-color: #aee6f9;
      border: none;
      border-radius: 50%;
      color: white;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 16px;
    }

    .chat-input button:hover {
      background-color: #81d4fa;
    }

    .chat-avatar {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      background-color: white;
      border: 1px solid #81d4fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;  /* 중앙에 배치하기 위한 여백 */
    }

    .chat-avatar svg {
      width: 22px;  /* 눈꽃의 크기 */
      height: 22px; /* 눈꽃의 크기 */
      fill: url(#grad1); /* 하늘색과 흰색 그라디언트 */
    }

    /* 그라디언트 정의 */
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color: #00bcd4; stop-opacity: 1" />
          <stop offset="100%" style="stop-color: #ffffff; stop-opacity: 1" />
        </linearGradient>
      </defs>
    </svg>
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">뚜뚜뭉</div> <!-- 이름 변경 -->
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." />
      <button id="send-btn">💬</button>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById("send-btn");
    const input = document.getElementById("chat-input");
    const messages = document.getElementById("messages");

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;

      const message = document.createElement("div");
      message.className = "message";

      const box = document.createElement("div");
      box.className = "cat-box";
      box.textContent = text;

      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";

      avatar.innerHTML = `
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 0l2 12 6-10 4 4-10 6 12 2-2 4-12-2 6 10-4 4-6-10-2 12h-4l-2-12-6 10-4-4 10-6-12-2 2-4 12 2-6-10 4-4 6 10 2-12h4z" fill="url(#grad1)"/>
        </svg>
      `;

      box.appendChild(avatar);
      message.appendChild(box);
      messages.appendChild(message);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
      input.focus();
    }
  </script>
</body>
</html>
