<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뚜뚜뭉 채팅</title>

  <!-- 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f0faff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 360px;
      height: 540px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #cfa678;  /* 연갈색으로 변경 */
      color: #0288d1;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #4fc3f7; }
      50% { text-shadow: 0 0 10px #81d4fa; }
      100% { text-shadow: 0 0 5px #4fc3f7; }
    }

    .chat-messages {
      flex-grow: 1;
      background-color: #e6f7fb;
      padding: 15px;
      overflow-y: auto;
      animation: scroll-up 5s linear infinite;
    }

    @keyframes scroll-up {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }

    .message {
      display: flex;
      margin-bottom: 12px;
      position: relative;
    }

    .cat-box {
      background-color: #daf2f9;
      border: 2px dashed #81d4fa;
      border-radius: 15px;
      padding: 10px 14px;
      max-width: 75%;
      word-break: break-word;
      font-size: 15px;
      color: #333;
      position: relative;
      animation: pop-in 0.3s ease-out;
    }

    .cat-box::before {
      content: '';
      position: absolute;
      top: 10px;
      left: -10px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-right: 10px solid #81d4fa;
      border-bottom: 10px solid transparent;
    }

    @keyframes pop-in {
      0% { opacity: 0; transform: scale(0.7); }
      80% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 메세지 입력란 제거 */
    .chat-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">뚜뚜뭉</div> <!-- 텍스트 변경 -->
    <div class="chat-messages" id="messages">
      <!-- 여기서 자동으로 올라가는 메시지가 들어가야 합니다 -->
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");

    // 자동으로 메시지가 올라가게 만드는 코드
    function createMessage(text) {
      const message = document.createElement("div");
      message.className = "message";

      const box = document.createElement("div");
      box.className = "cat-box";
      box.textContent = text;

      message.appendChild(box);
      messages.appendChild(message);
    }

    // 예시 메시지 자동 생성
    setInterval(() => {
      createMessage("이건 자동으로 올라가는 메시지입니다!");
    }, 3000); // 3초마다 메시지 생성
  </script>
</body>
</html>
