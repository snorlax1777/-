<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>채팅 테스트</title>
  <style>
    @font-face {
      font-family: 'BMYEONSUNGOTF';
      src: url('BMYEONSUNGOTF.woff') format('woff'); /* 로컬로 다운받은 폰트 */
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'BMYEONSUNGOTF', sans-serif;
      overflow: hidden;
    }

    .chat-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      padding: 1rem;
      gap: 0.5rem;
    }

    .chat-bubble {
      position: relative;
      max-width: 80%;
      background: #fff;
      color: #000;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 2px solid #d2b48c;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      font-size: 1rem;
    }

    .chat-bubble .character {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 36px;
      height: 36px;
    }

    .chat-bubble .character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-bubble">
      <div class="character">
        <img src="https://i.imgur.com/IUAhMUa.png" alt="캐릭터">
      </div>
      ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ
    </div>
  </div>
</body>
</html>
