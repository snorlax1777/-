<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>채팅 오버레이</title>
  <style>
    @font-face {
      font-family: 'JJamJak';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2204@1.0/Jalnan2.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'JJamJak', sans-serif;
    }

    .chat-container {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .chat-bubble {
      font-size: 1.6rem;
      font-weight: 900;
      color: #ffeb3b;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      transform: skew(-7deg);
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000;
      animation: fadeInUp 0.3s ease-out, fadeOut 0.5s ease-in forwards;
      animation-delay: 0s, 4s;
      word-break: break-word;
      display: inline-block;
      pointer-events: auto;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px) skew(-7deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) skew(-7deg);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-30px) skew(-7deg);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer"></div>

  <script>
    const messages = [
      "안녕하세요~",
      "오늘 방송도 기대돼요!",
      "캐릭터 너무 귀엽다 😍",
      "좋아요 누르고 갑니다~",
      "ㅋㅋㅋㅋㅋㅋㅋㅋ",
      "오늘 점심 뭐 드셨어요?",
      "소통 짱이에요!",
      "와 진짜 이쁘다~",
      "채팅창 너무 귀여워요",
      "다음 게임 뭐예요?",
      "고양이 같다!",
      "헉 목소리 뭐야..",
      "존예다.."
    ];

    const chatContainer = document.getElementById("chatContainer");
    let index = 0;

    function addChat() {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble";
      bubble.textContent = messages[index % messages.length];
      chatContainer.appendChild(bubble);
      index++;

      // 제거 (5초 후)
      setTimeout(() => {
        bubble.remove();
      }, 5000);
    }

    setInterval(addChat, 1500);
  </script>
</body>
</html>
